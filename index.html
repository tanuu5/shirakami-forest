<script type="module">
import * as THREE from 'three';

/* ================= 乱数・ノイズ ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return (a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v)*2-1;}
function fbm(x,y,o){let s=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*vnoise(x*f+i*17.3,y*f-i*9.1);n+=a;a*=.5;f*=2.03;}return s/n;}
const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
const lerp=(a,b,t)=>a+(b-a)*t;

/* ================= 地形 ================= */
const HALF=200, WALK=172;
const streamX=z=>18*Math.sin(z*.018)+7*Math.sin(z*.047+1.3);
const trailX=z=>streamX(z)+11+3*Math.sin(z*.06+.5);
const lowH=(x,z)=>9*fbm(x*.007,z*.007,4)-.045*z;
const bedH=z=>lowH(streamX(z),z)-1.4;
const waterY=z=>bedH(z)+.55;
function height(x,z){
  const d=Math.abs(x-streamX(z));
  let h=lowH(x,z)+2.2*fbm(x*.03+50,z*.03,3)+.22*vnoise(x*.45,z*.45)+Math.min(d,70)*.085;
  const bed=bedH(z);
  return bed+(h-bed)*smooth(1.8,8,d);
}

/* ================= 自動歩行のルート =================
   遊歩道を沢沿いに下り、沢のほとり2か所とブナの巨木に寄り道して立ち止まる。終点で折り返して入口へ戻り、以後くり返す */
const BIG={x:trailX(32)+7.5,z:32};
const route=[],clearPts=[];
(function(){
  const add=(x,z,o)=>route.push(Object.assign({x,z},o||{}));
  const detour=pts=>{for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],n=Math.ceil(Math.hypot(b.x-a.x,b.z-a.z));
    for(let k=0;k<=n;k++)clearPts.push({x:lerp(a.x,b.x,k/n),z:lerp(a.z,b.z,k/n)});}};
  let z=-136;
  while(z<=160){
    add(trailX(z),z);
    if(z===-50||z===96){
      const vz=z+5,sx=streamX(vz),vp={x:sx+4.3,z:vz},p1={x:trailX(z),z},p3={x:trailX(z+10),z:z+10};
      add(vp.x,vp.z,{pause:8,look:{x:sx,y:waterY(vz+6),z:vz+6},label:'沢のほとりで一息'});
      add(p3.x,p3.z);detour([p1,vp,p3]);z+=12;continue;
    }
    if(z===24){
      const vp={x:BIG.x-3.4,z:BIG.z-2.2},p1={x:trailX(24),z:24},p3={x:trailX(40),z:40};
      add(vp.x,vp.z,{pause:9,look:{x:BIG.x,y:height(BIG.x,BIG.z)+12,z:BIG.z},label:'ブナの巨木を見上げる'});
      add(p3.x,p3.z);detour([p1,vp,p3]);z=42;continue;
    }
    z+=2;
  }
  add(trailX(162),162,{pause:5,look:null,label:'ここで折り返す'});
  for(let i=route.length-2;i>=0;i--){const p=route[i];if(!p.pause)add(p.x,p.z);}
  Object.assign(route[route.length-1],{pause:5,look:null,label:'遊歩道の入口'});
})();
const nearRoute=(x,z,r)=>clearPts.some(p=>Math.abs(x-p.x)<r&&Math.abs(z-p.z)<r&&Math.hypot(x-p.x,z-p.z)<r);

/* ================= レンダラ ================= */
const canvas=document.getElementById('c');

renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));

renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.toneMappingExposure=1.05;

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0xd7e3c6,.013);
scene.background=new THREE.Color(0xd7e3c6);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,430);
camera.rotation.order='YXZ';

const hemi=new THREE.HemisphereLight(0xe6f0d0,0x4a5634,1.2);scene.add(hemi);

const sun=new THREE.DirectionalLight(0xfff1d0,2.6);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-55,right:55,top:55,bottom:-55,near:1,far:260});
sun.shadow.bias=-.0006;sun.shadow.normalBias=.05;
scene.add(sun,sun.target);

const U={uTime:{value:0}};
const glowLeaf={value:.28}, glowFloor={value:.08};

/* ================= キャンバス・テクスチャ ================= */
function canvasTex(w,h,draw,repeat){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;}
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t;
}
function wrapDraw(g,w,h,x,y,m,fn){for(const ox of [-w,0,w])for(const oy of [-h,0,h]){if(x+ox<-m||x+ox>w+m||y+oy<-m||y+oy>h+m)continue;fn(x+ox,y+oy);}}

const barkTex=canvasTex(256,512,(g,w,h)=>{
  g.fillStyle='#b3b6ac';g.fillRect(0,0,w,h);const r=mulberry32(7);
  const cols=['214,216,204','176,186,160','118,126,108','234,234,224','150,162,118','196,200,186'];
  for(let i=0;i<1600;i++){const x=r()*w,y=r()*h,rw=3+r()*24,rh=2+r()*12,rot=r()*.6-.3,c=cols[(r()*cols.length)|0],a=.12+r()*.34;
    wrapDraw(g,w,h,x,y,30,(X,Y)=>{g.fillStyle=`rgba(${c},${a})`;g.beginPath();g.ellipse(X,Y,rw,rh,rot,0,Math.PI*2);g.fill();});}
  for(let i=0;i<300;i++){const x=r()*w,y=r()*h,l=5+r()*14;g.fillStyle='rgba(78,82,74,.32)';g.fillRect(x,y,l,1.3);if(x+l>w)g.fillRect(x-w,y,l,1.3);}
},true);

const leafTex=canvasTex(256,256,(g)=>{
  const r=mulberry32(11);
  g.strokeStyle='rgba(90,80,60,.9)';g.lineWidth=1.6;
  for(let i=0;i<5;i++){g.beginPath();g.moveTo(128,128);g.quadraticCurveTo(128+(r()-.5)*120,128+(r()-.5)*120,128+(r()-.5)*190,128+(r()-.5)*190);g.stroke();}

    const a=r()*Math.PI*2,d=Math.sqrt(r())*86,x=128+Math.cos(a)*d,y=128+Math.sin(a)*d;
    const len=40+r()*26,wid=len*.44,rot=r()*Math.PI*2,l=76+r()*18;

    const N=40;for(let k=0;k<=N;k++){const t=k/N*Math.PI*2;let px=Math.cos(t)*len/2,py=Math.sin(t)*wid/2;
      py*=(1+.07*Math.sin(t*18))*(1-.3*Math.max(0,px/(len/2)));k?g.lineTo(px,py):g.moveTo(px,py);}
    g.closePath();g.fillStyle=`hsl(84,28%,${l}%)`;g.fill();
    g.strokeStyle='rgba(70,90,45,.38)';g.lineWidth=1.1;g.beginPath();g.moveTo(-len/2-5,0);g.lineTo(len/2,0);g.stroke();
    g.lineWidth=.7;g.beginPath();for(let v=-4;v<=3;v++){const vx=v*len/10;g.moveTo(vx,0);g.lineTo(vx+len/9,wid*.42);g.moveTo(vx,0);g.lineTo(vx+len/9,-wid*.42);}g.stroke();
    g.restore();
  }
});

const sasaTex=canvasTex(256,256,(g)=>{
  const r=mulberry32(23);
  for(let i=0;i<28;i++){
    const bx=128+(r()-.5)*70,tx=bx+(r()-.5)*90,ty=250-50-r()*120;
    g.strokeStyle='rgba(120,140,70,.9)';g.lineWidth=1.6;g.beginPath();g.moveTo(bx,256);g.lineTo(tx,ty);g.stroke();
    for(let k=0;k<2;k++){
      const ang=-Math.PI/2+(r()-.5)*2.4,len=58+r()*40,wid=11+r()*7,l=70+r()*18;
      g.save();g.translate(tx,ty);g.rotate(ang);g.beginPath();g.moveTo(0,0);
      g.quadraticCurveTo(len*.35,-wid,len,0);g.quadraticCurveTo(len*.35,wid,0,0);
      g.fillStyle=`hsl(96,30%,${l}%)`;g.fill();
      g.strokeStyle='rgba(235,240,215,.55)';g.lineWidth=.8;g.stroke(); // 隈取りのような縁
      g.strokeStyle='rgba(80,100,50,.35)';g.beginPath();g.moveTo(0,0);g.lineTo(len*.95,0);g.stroke();
      g.restore();
    }
  }
});

const fernTex=canvasTex(256,256,(g)=>{
  const r=mulberry32(31);
  for(let f=0;f<6;f++){
    const ang=-Math.PI/2+(f/5-.5)*2.2+(r()-.5)*.2,len=120+r()*80;
    const P=t=>{const bend=t*t*.9*(ang< -Math.PI/2?-1:1);const a=ang+bend*.9;return[128+Math.cos(ang)*len*t+Math.cos(a)*6*t,254+Math.sin(ang)*len*t+t*t*len*.35];};
    g.strokeStyle='rgba(110,130,60,.95)';g.lineWidth=1.8;g.beginPath();for(let k=0;k<=30;k++){const[x,y]=P(k/30);k?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();
    for(let k=3;k<30;k++){const t=k/30,[x,y]=P(t),[x2,y2]=P(t+.02);const dx=x2-x,dy=y2-y,dl=Math.hypot(dx,dy)||1,nx=-dy/dl,ny=dx/dl,pl=(1-t)*26+4;
      for(const s of[-1,1]){g.fillStyle=`hsl(100,34%,${70+r()*14}%)`;g.beginPath();g.ellipse(x+nx*s*pl/2+dx/dl*2,y+ny*s*pl/2+dy/dl*2,pl/2,2.6,Math.atan2(ny*s,nx*s)+.35*s,0,Math.PI*2);g.fill();}}
  }
});

const groundTex=canvasTex(512,512,(g,w,h)=>{
  g.fillStyle='#665538';g.fillRect(0,0,w,h);const r=mulberry32(5);
  const cols=['#8a6a44','#a07d52','#735636','#5c4630','#9b8a60','#7d6a4a','#b09062','#6e5a3c'];
  for(let i=0;i<3400;i++){const x=r()*w,y=r()*h,l=4+r()*9,rot=r()*Math.PI,c=cols[(r()*cols.length)|0];

const Sound={

    const bq=(type,f,Q)=>{const b=ctx.createBiquadFilter();b.type=type;b.frequency.value=f;if(Q)b.Q.value=Q;return b;};

    this.rustleG=ctx.createGain();this.rustleG.gain.value=.015;loop(wb).connect(bq('bandpass',4200,.6)).connect(this.rustleG).connect(this.master);
    this.streamG=ctx.createGain();this.streamG.gain.value=0;this.streamG.connect(this.master);

  },
  bird(){
    if(!this.on||!this.ctx||this.ctx.state!=='running')return;

function collide(nx,nz){
  nx=Math.max(-WALK,Math.min(WALK,nx));nz=Math.max(-WALK,Math.min(WALK,nz));
  for(let gx=-1;gx<=1;gx++)for(let gz=-1;gz<=1;gz++){
    const list=grid.get(cellKey(nx+gx*8,nz+gz*8));if(!list)continue;
    for(const t of list){const dx=nx-t.x,dz=nz-t.z,d=Math.hypot(dx,dz);if(d<t.rad&&d>1e-4){nx=t.x+dx/d*t.rad;nz=t.z+dz/d*t.rad;}}
  }
  return [nx,nz];
}
const DIRS=['北','北東','東','南東','南','南西','西','北西'];
const readout=document.getElementById('readout');let readT=0;

function updatePlayer(dt,time){
  let f=0,s=0,turn=0;
  if(keys.has('KeyW')||keys.has('ArrowUp'))f+=1;if(keys.has('KeyS')||keys.has('ArrowDown'))f-=1;
  if(keys.has('KeyD'))s+=1;if(keys.has('KeyA'))s-=1;
  if(keys.has('ArrowLeft'))turn+=1;if(keys.has('ArrowRight'))turn-=1;
  f+=joyVec.y;s+=joyVec.x;player.yaw+=turn*dt*1.6;
  if(auto&&(Math.abs(f)>.05||Math.abs(s)>.05||turn))setAuto(false);
  const inWater=Math.abs(player.x-streamX(player.z))<3.2&&height(player.x,player.z)<waterY(player.z)-.05;
  let speed=(keys.has('ShiftLeft')||keys.has('ShiftRight'))?4.6:2.3;if(inWater)speed*=.55;
  const fx=-Math.sin(player.yaw),fz=-Math.cos(player.yaw),rx=Math.cos(player.yaw),rz=-Math.sin(player.yaw);
  let tx=fx*f+rx*s,tz=fz*f+rz*s;const tl=Math.hypot(tx,tz);if(tl>1){tx/=tl;tz/=tl;}
  if(auto){const m=autoStep(dt);tx=m.tx;tz=m.tz;speed=m.speed*(inWater?.55:1);}
  const k=1-Math.exp(-dt*7);player.vx+=(tx*speed-player.vx)*k;player.vz+=(tz*speed-player.vz)*k;
  const [nx,nz]=collide(player.x+player.vx*dt,player.z+player.vz*dt);
  const moved=Math.hypot(nx-player.x,nz-player.z)/Math.max(dt,1e-4);player.x=nx;player.z=nz;
  const prev=player.phase;player.phase+=dt*(1.6+moved*.75)*(moved>.25?1:0);
  if(Math.floor(prev/Math.PI)!==Math.floor(player.phase/Math.PI))Sound.step(inWater,Math.min(1,moved/2.3));
  const bob=Math.sin(player.phase*2)*.035*Math.min(1,moved/2.3);
  const gy=height(player.x,player.z);const target=Math.max(gy,inWater?waterY(player.z)-.45:gy)+1.62;
  player.eye=player.eye?lerp(player.eye,target,1-Math.exp(-dt*10)):target;
  camera.position.set(player.x,player.eye+bob,player.z);
  if(auto)autoLook(dt,time);
  camera.rotation.set(player.pitch,player.yaw,Math.sin(player.phase)*.004*Math.min(1,moved/2.3));
  readT-=dt;if(readT<=0){readT=.25;const a=Math.atan2(-fx,fz);const di=DIRS[((Math.round(a/(Math.PI/4))%8)+8)%8];
    readout.textContent=`${SEASONS[season].name} · ${di} · 標高 ${Math.round(gy*3.2+540)} m`;
    autoState.textContent=auto?(auto.wait>0&&auto.label?`立ち止まる — ${auto.label}`:`自動歩行中 · ${auto.i<route.length/2?'沢沿いを下る':'入口へ戻る'}`):'';}
  Sound.update(time,Math.abs(player.x-streamX(player.z)));
}

/* ================= 自動歩行 ================= */
let auto=null;
const autoBtn=document.getElementById('autoBtn'),autoState=document.getElementById('autoState');
const angDiff=(a,b)=>{let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d;};
function setAuto(on){
  if(on&&!auto){
    // 今いる場所から近く、向いている方向に続くルート上の点から歩き始める
    const fx=-Math.sin(player.yaw),fz=-Math.cos(player.yaw);let best=0,bs=1e9;
    route.forEach((p,i)=>{const q=route[(i+1)%route.length],dl=Math.hypot(q.x-p.x,q.z-p.z)||1;
      const sc=Math.hypot(p.x-player.x,p.z-player.z)-4*((q.x-p.x)*fx+(q.z-p.z)*fz)/dl;if(sc<bs){bs=sc;best=i;}});
    auto={i:best,wait:0,heading:player.yaw,look:null,label:'',uYaw:0,uPitch:0,lastLook:-99,stuckT:0,sx:player.x,sz:player.z};
  }else if(!on)auto=null;
  autoBtn.setAttribute('aria-pressed',String(!!auto));autoBtn.textContent=auto?'自動歩行を止める':'自動で歩く';
  autoState.textContent=auto?'自動歩行中':'';
}
function autoStep(dt){
  const a=auto,Z={tx:0,tz:0,speed:0};
  if(a.wait>0){a.wait-=dt;if(a.wait<=0){a.i=(a.i+1)%route.length;a.look=null;a.label='';a.stuckT=0;a.sx=player.x;a.sz=player.z;}return Z;}
  let wp,dx,dz,d;
  for(let g=0;g<4;g++){wp=route[a.i];dx=wp.x-player.x;dz=wp.z-player.z;d=Math.hypot(dx,dz);
    if(d<(wp.pause?.9:2.2)){if(wp.pause){a.wait=wp.pause;a.look=wp.look;a.label=wp.label;return Z;}a.i=(a.i+1)%route.length;}else break;}
  a.stuckT+=dt;if(a.stuckT>2.5){if(Math.hypot(player.x-a.sx,player.z-a.sz)<.7)a.i=(a.i+1)%route.length;a.stuckT=0;a.sx=player.x;a.sz=player.z;}
  a.heading+=angDiff(a.heading,Math.atan2(-dx,-dz))*(1-Math.exp(-dt*2.2));
  return {tx:-Math.sin(a.heading),tz:-Math.cos(a.heading),speed:wp.pause?Math.min(1.35,.35+d*.4):1.35};
}
function autoLook(dt,time){
  // 歩きながらゆっくり左右を見回し、ときどき林冠を見上げる。立ち止まる場所では見どころに目を向ける
  const a=auto;let ty,tp;
  if(a.wait>0&&a.look){const L=a.look,dx=L.x-player.x,dz=L.z-player.z;ty=Math.atan2(-dx,-dz);tp=Math.atan2(L.y-player.eye,Math.hypot(dx,dz));}
  else{ty=a.heading+.42*Math.sin(time*.11)+.18*Math.sin(time*.27+1.3);tp=-.04+.55*Math.pow(Math.max(0,Math.sin(time*.07+2.1)),6)+.05*Math.sin(time*.23);}
  if(time-a.lastLook>3){const k=Math.exp(-dt*.6);a.uYaw*=k;a.uPitch*=k;}
  const s=1-Math.exp(-dt*1.6);
  player.yaw+=angDiff(player.yaw,ty+a.uYaw)*s;
  player.pitch+=(Math.max(-1.3,Math.min(1.3,tp+a.uPitch))-player.pitch)*s;
}

/* ================= ループ ================= */
const clock=new THREE.Clock();let idleT=0;
function frame(){
  const dt=Math.min(clock.getDelta(),.05),time=clock.elapsedTime;
  U.uTime.value=time;if(U.water)U.water.value=time;
  if(started)updatePlayer(dt,time);
  else{idleT+=dt;const gy=height(player.x,player.z);camera.position.set(player.x,gy+1.62,player.z);camera.rotation.set(.05+Math.sin(idleT*.1)*.04,Math.PI+Math.sin(idleT*.07)*.35,0);}
  // 影のカメラを歩く人に追従させる（テクセルにスナップしてちらつきを抑える）
  const cx=Math.round(camera.position.x/2)*2,cz=Math.round(camera.position.z/2)*2,cy=height(cx,cz);
  sun.target.position.set(cx,cy,cz);sun.position.set(cx,cy,cz).addScaledVector(sunDir,120);
  if(dust){const p=dust.geometry.attributes.position,b=dust.userData.base;
    for(let i=0;i<p.count;i++){const bx=b[i*3]+Math.sin(time*.2+i)*.6,bz=b[i*3+2]+Math.cos(time*.17+i*1.3)*.6;
      let x=((bx-camera.position.x)%44+66)%44-22,z=((bz-camera.position.z)%44+66)%44-22;
      p.setXYZ(i,camera.position.x+x,camera.position.y-3+((b[i*3+1]+time*.08+Math.sin(time*.3+i)*.2)%12+12)%12,camera.position.z+z);}
    p.needsUpdate=true;}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

/* ================= UI ================= */
const enter=document.getElementById('enter');
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{applySeason(+b.dataset.season);canvas.focus();}));
const soundBtn=document.getElementById('sound');
soundBtn.addEventListener('click',()=>{const on=Sound.toggle();soundBtn.textContent=on?'音 オン':'音 オフ';soundBtn.setAttribute('aria-pressed',String(on));canvas.focus();});
const enterAuto=document.getElementById('enterAuto');
function begin(withAuto){
  started=true;player.eye=0;Sound.start();document.getElementById('intro').classList.add('gone');document.body.classList.add('walking');
  canvas.focus();
  if(withAuto){setAuto(true);return;}
  if(matchMedia('(hover:hover)').matches&&canvas.requestPointerLock){try{const p=canvas.requestPointerLock();if(p&&p.catch)p.catch(()=>{});}catch(_){}}
}
enter.addEventListener('click',()=>begin(false));
enterAuto.addEventListener('click',()=>begin(true));
autoBtn.addEventListener('click',()=>{setAuto(!auto);canvas.focus();});
requestAnimationFrame(()=>setTimeout(async()=>{
  try{await buildWorld();}catch(err){console.error(err);enter.textContent='読み込みに失敗しました';return;}
  enter.disabled=false;enter.textContent='森に入る';enterAuto.disabled=false;
  requestAnimationFrame(frame);
},30));
renderer.render(scene,camera);
</script>
